server:
  port: 8080

spring:
  application:
    name: baby-breakfast-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/baby_breakfast?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:baby_breakfast}
    password: ${DB_PASSWORD:baby_breakfast}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO